/* Layout: sticky masthead with scrolling tab rail, then one themed view at a time (cards on a 12-col-ish auto grid).

:root{

  --c-nan:#2a78d6;--c-amu:#eb6834;--c-pri:#1baf7a;--c-uno:#8a96a9;--c-5:#e87ba4;--c-7:#6250d6;--c-4:#eda100;--c-8:#e34948;

  --font-d:'Bricolage Grotesque','Inter',system-ui,sans-serif;--font-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}

  --bg:#0b1220;--surface:#141d2f;--surface2:#1b2740;--ink:#eaf0f9;--ink2:#b3c0d4;--muted:#8392a9;--line:#273550;
  --c-nan:#3987e5;--c-amu:#d95926;--c-pri:#199e70;--c-uno:#7a869b;--c-5:#d55181;--c-7:#9085e9;--c-4:#c98500;--c-8:#e66767;
  --good:#4cc99a;--warn:#e6b04a;--bad:#ef7b7a;--good-bg:#12392f;--warn-bg:#3b2f12;--bad-bg:#3d1c1e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220;--surface:#141d2f;--surface2:#1b2740;--ink:#eaf0f9;--ink2:#b3c0d4;--muted:#8392a9;--line:#273550;
  --c-nan:#3987e5;--c-amu:#d95926;--c-pri:#199e70;--c-uno:#7a869b;--c-5:#d55181;--c-7:#9085e9;--c-4:#c98500;--c-8:#e66767;
  --good:#4cc99a;--warn:#e6b04a;--bad:#ef7b7a;--good-bg:#12392f;--warn-bg:#3b2f12;--bad-bg:#3d1c1e;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1320px;margin:0 auto}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--c-nan)}
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.mast-in{max-width:1320px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--c-nan),var(--c-pri));display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
h1{font-size:22px;line-height:1.1;font-weight:700}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.tools{display:flex;gap:8px;align-items:center}
.btn{font:inherit;font-size:12px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--c-nan);color:var(--ink)}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,select:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--c-nan);outline-offset:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:12px 0 0;scrollbar-width:thin}
.tab{font:inherit;font-weight:500;font-size:13px;color:var(--ink2);background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 10px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--c-nan);border-bottom-color:var(--c-nan)}
main{padding-top:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:26px;font-weight:700}
.head p{margin:4px 0 0;color:var(--ink2);max-width:70ch}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.gk{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media(max-width:900px){.g21{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card h3{font-size:16px;font-weight:600}
.card .cs{color:var(--muted);font-size:12px;margin:2px 0 12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.k-l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.k-v{font-family:var(--font-d);font-size:28px;font-weight:700;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.k-v small{font-size:14px;font-weight:500;color:var(--ink2);font-family:var(--font-b)}
.k-s{font-size:12px;color:var(--ink2);margin-top:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.cb{position:relative;width:100%}
.cb canvas{display:block}
.ctl{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:120px;max-width:100%}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;color:var(--ink2);background:none;border:0;border-radius:7px;padding:5px 12px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin-bottom:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.nan{background:color-mix(in srgb,var(--c-nan) 16%,var(--surface));color:var(--c-nan)}.pill.amu{background:color-mix(in srgb,var(--c-amu) 16%,var(--surface));color:var(--c-amu)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.tk{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.tk li{padding-left:16px;position:relative;color:var(--ink2)}
.tk li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:2px;background:var(--c-nan)}
.tk b{color:var(--ink)}
.dt-tools{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.dt-tools input{flex:1 1 200px}
.dt-n{font-size:12px;color:var(--muted)}
.dt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
th{background:var(--surface2);color:var(--ink2);font-weight:600;position:sticky;top:0;cursor:pointer;user-select:none}
th.n,td.n{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--c-nan) 6%,var(--surface))}
.dt-pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--muted)}
.hm{border-collapse:separate;border-spacing:2px;font-size:11px}
.hm th,.hm td{padding:4px 6px;text-align:center;border:0;border-radius:4px;cursor:pointer;max-width:none}
.hm th{background:none;position:static;cursor:default;color:var(--muted)}
.hm td.sel{outline:2px solid var(--ink);outline-offset:0}
.hmw{overflow:auto;max-height:520px}
.sbar{display:flex;height:14px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface2)}
.sbar i{display:block;height:100%}
.s-nan{background:var(--c-nan)}.s-amu{background:var(--c-amu)}.s-pri{background:var(--c-pri)}.s-uno{background:var(--c-uno)}
.rc{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.rc.cur{border-color:color-mix(in srgb,var(--c-nan) 40%,var(--line))}
.rc .big{font-family:var(--font-d);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.rc .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2);border-radius:20px;padding:4px 11px;cursor:pointer}
.chip.on{background:var(--c-nan);border-color:var(--c-nan);color:#fff}
.cmp{width:100%}
.cmp td:first-child{color:var(--muted);width:34%}
.src li{margin-bottom:6px;color:var(--ink2);word-break:break-word}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:50}
.foot{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
@media(max-width:600px){h1{font-size:18px}.head h2{font-size:21px}.k-v{font-size:23px}.card{padding:14px}}
@media(prefers-reduced-motion:no-preference){.view{animation:fade .25s ease}@keyframes fade{from{opacity:.4}to{opacity:1}}}

 const mg=(p,v)=>CP.find(r=>r.Brand==='Nandini'&&r.Category===p&&(!v||r.Product_Variant.startsWith(v)));
 const gh=mg('Ghee'),bu=mg('Butter'),to=mg('Milk','Toned');
 const pp=CPG.filter(r=>r.Brand==='Nandini'&&r.Category==='Paneer');
 const prod=sum(DM,r=>r.Total_Daily_Production_LPD),kmf=sum(DM,r=>r.KMF_Nandini_Procurement_LPD),amu=sum(DM,r=>r.Amul_Procurement_LPD),pri=sum(DM,r=>r.Other_Private_Dairies_LPD);
 const ins=(t,b)=>`<li><b>${t}</b> ${b}</li>`;
 return head('Sources, insights and disclaimer','Where the numbers come from, what they suggest for the dairy industry, and how to read them.')+
 `<div class="grid g2">${card('Industry insights','Suggested priorities for Nandini, supported by the workbook where it can be',`<ul class="tk">
  ${ins('1. Push butter and ghee in northern Karnataka.',`Nandini’s average butter share is ${pc(av(N,'Butter',nS))} in the Belagavi and Kalaburagi divisions against ${pc(av(So,'Butter',nS))} in the Bengaluru and Mysuru divisions; for ghee it is ${pc(av(N,'Ghee',nS))} against ${pc(av(So,'Ghee',nS))}. That gap is room to grow. Butter and ghee are value-added products with a long shelf life and higher margins (Nandini ghee ${pc(gh&&gh.Profit_Margin_Ratio_Percent)} and butter ${pc(bu&&bu.Profit_Margin_Ratio_Percent)} against ${pc(to&&to.Profit_Margin_Ratio_Percent)} for toned milk), and private brands hold only about ${pc(av(N,'Ghee',pS),0)} of northern ghee. Amul is the main rival there (${pc(av(N,'Butter',aS))} of butter).`)}
  ${ins('2. Invest in logistics and digitalisation.','Cold-chain transport, route planning, digital ordering and stock tracking help reach northern districts that are far from the main dairies and cut losses on perishable products.')}
  ${ins('3. Run nutrition awareness programmes to grow paneer.',`Paneer is a protein-rich food (about ${nf(mean(pp.map(r=>r['Protein (g per 100g)'])),0)} g protein per 100 g in the Nandini range on file). Campaigns on its nutritional value can lift demand beyond cooking at home.`)}
  ${ins('4. Expand beyond Karnataka, invest in R&D and reward farmers.','Look at wider national and export markets, put money into research on new products, shelf life and quality, and give farmers incentives to keep milk supply growing. Nandini’s payout already includes a state incentive of ₹5 per litre.')}
 </ul>`)}
 ${card('Sources cited in the workbook',`${srcs.size} distinct sources`,`<ul class="tk src" style="max-height:520px;overflow:auto">${[...srcs.values()].map(x=>`<li>${x.u?`<a href="${esc(x.u)}" target="_blank" rel="noopener noreferrer">${esc(x.t)}</a>`:esc(x.t)}</li>`).join('')}</ul>`)}</div>
 <div class="grid g2" style="margin-top:16px">${card('Why production and procurement differ','State production is about '+nf(prod/1e5,0)+' lakh L/day, but organised procurement is much lower',`<p class="note" style="font-size:13px;color:var(--ink2);margin:0">Total production is all the milk produced in a district. A large part of it never enters the organised market: farmers keep some for their own use and for feeding calves, and some is sold directly to neighbours and local vendors. Procurement is the milk bought from farmers by dairies, namely Nandini (KMF) at about ${nf(kmf/1e5,0)} lakh L/day, Amul at about ${nf(amu/1e5,0)} lakh and other private dairies at about ${nf(pri/1e5,0)} lakh. That is why procurement is far smaller than production.</p>`)}
 ${card('Disclaimer','Please read before using this dashboard',`<p class="note" style="font-size:13px;color:var(--ink2);margin:0">This dashboard is for academic and professional purposes only. It does not represent any actual company, business or brand. The data has been analysed from the information available when it was prepared. If you find any figure that looks wrong or outdated, or have a suggestion to improve the dashboard, please share it so it can be corrected. Suggestions are welcome.</p>`)}</div>
 ${card('Sheet explorer','Browse any original sheet. Click column headers to sort.',`<div class="ctl" style="border:0;padding:0;margin-bottom:10px">${fld('Sheet',sel('data.sheet',sheets.map(n=>[n,`${n} (${nf(S[n].length)} rows)`]),s.sheet))}</div><div id="t-data"></div>`)}`}
function pData(){const s=ST.data,rows=S[s.sheet],cols=COLS[s.sheet];
 if(dtS['t-data']&&dtS['t-data'].sheet!==s.sheet)delete dtS['t-data'];
 DT('t-data',cols.map(c=>({k:c,n:rows.some(r=>typeof r[c]==='number')&&!rows.some(r=>typeof r[c]==='string')})),rows,{ps:15});dtS['t-data'].sheet=s.sheet}
/* ---------- router ---------- */
const TABS=[['overview','Overview',vOverview,pOverview],['rates','Procurement rates',vRates,pRates],['market','Market share',vMarket,pMarket],['supply','Supply & demand',vSupply,pSupply],['retail','Retail & pricing',vRetail,pRetail],['history','Price history',vHist,pHist],['products','Products',vProducts,pProducts],['network','Network',vNetwork,pNetwork],['farm','Farm & cattle',vFarm,pFarm],['profit','Profitability',vProfit,pProfit],['data','Sources & insights',vData,pData]];
let cur='overview';
function renderTabs(){$('#tabs').innerHTML=TABS.map(t=>`<button class="tab" role="tab" data-tab="${t[0]}" aria-selected="${t[0]===cur}">${t[1]}</button>`).join('')}
function show(keepScroll){const t=TABS.find(x=>x[0]===cur)||TABS[0],y=window.scrollY;killCharts();readColors();renderTabs();
 try{$('#view').innerHTML=`<div class="view">${t[2]()}</div>`;t[3]()}catch(e){console.error(e);$('#view').innerHTML=`<div class="card"><h3>Something went wrong drawing this tab</h3><div class="cs">${esc(e.message)}</div></div>`}
 if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0)}
function route(){const h=(location.hash||'').slice(1);cur=TABS.some(t=>t[0]===h)?h:'overview';show(false)}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{
 const tb=e.target.closest('[data-tab]');if(tb){location.hash=tb.dataset.tab;if(location.hash.slice(1)===cur)show(false);return}
 const sg=e.target.closest('.seg button');if(sg){const[t,k]=sg.parentElement.dataset.grp.split('.');const v=sg.dataset.v;ST[t][k]=(t==='rates'&&k==='type')?v:v;if(t==='rates'&&k==='type'){const ty=v;ST.rates.fat=ty==='Cow'?3.5:6;ST.rates.snf=ty==='Cow'?8.5:9}if(t==='prod'&&k==='view'){}show(true);return}
 const ch=e.target.closest('[data-chip]');if(ch){const b=ch.dataset.chip,a=ST.farm.sel,i=a.indexOf(b);if(i>=0)a.splice(i,1);else a.push(b);show(true);return}
 const hc=e.target.closest('.hm td[data-fat]');if(hc){ST.rates.fat=+hc.dataset.fat;ST.rates.snf=+hc.dataset.snf;show(true);return}
 const so=e.target.closest('[data-dtsort]');if(so){const id=so.dataset.dtsort,st=dtS[id],k=so.dataset.k;if(st.k===k)st.d=-st.d;else{st.k=k;st.d=1}dtBody(id);return}
 const pg=e.target.closest('[data-dtpage]');if(pg){const id=pg.dataset.dtpage;dtS[id].p+=+pg.dataset.d;dtBody(id);return}
 const cp=e.target.closest('[data-dtcopy]');if(cp){copyText(dtCsv(cp.dataset.dtcopy));return}
 if(e.target.id==='themeBtn'){const de=document.documentElement,dark=de.dataset.theme?de.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;de.dataset.theme=dark?'light':'dark';try{localStorage.setItem('kd-theme',de.dataset.theme)}catch(_){}show(true)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-sel]');if(!el)return;const[t,k]=el.dataset.sel.split('.');ST[t][k]=el.dataset.num?parseFloat(el.value):el.value;show(true)});
document.addEventListener('input',e=>{const el=e.target.closest('.dt-q');if(!el)return;const id=el.dataset.dt;dtS[id].q=el.value;dtS[id].p=0;dtBody(id)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>show(true));
try{const t=localStorage.getItem('kd-theme');if(t)document.documentElement.dataset.theme=t}catch(_){}
route();
})();
</script>

</body></html>
